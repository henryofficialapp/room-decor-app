name: Core tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Test room, recommendation, placement and cost logic
        run: dotnet test Tests/Core.Tests/Core.Tests.csproj
